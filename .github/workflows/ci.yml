name: ci

on: push

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # --bun matches vercel.json's buildCommand, so CI builds what deploys.
      - name: Build
        run: bun run --bun build

      # Needs the build above: the Studio round-trip test compares against the
      # content database, which only has rows after a build.
      - name: Test
        run: bun run test run
